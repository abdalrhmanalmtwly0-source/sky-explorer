<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مستكشف السماء - تطبيق ويب تفاعلي لاستكشاف النجوم والكواكب والمجرات مع خريطة سماء حية وتتبع محطة الفضاء الدولية">
    <meta name="keywords" content="فلك، نجوم، كواكب، مجرات، سماء، خريطة سماء، محطة الفضاء، GPS، بوصلة">
    <meta name="author" content="Manus AI">
    <meta name="theme-color" content="#000010">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مستكشف السماء">
    <meta property="og:title" content="مستكشف السماء">
    <meta property="og:description" content="استكشف النجوم والكواكب والمجرات بطريقة تفاعلية">
    <meta property="og:type" content="website">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><circle cx='96' cy='96' r='90' fill='%23000010' stroke='%232c5d87' stroke-width='2'/><circle cx='96' cy='96' r='4' fill='%23ffffff'/></svg>">
    <title>مستكشف السماء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://d3-celestial.github.io/celestial.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
    <div id="sky-map-container">
        <!-- خريطة السماء ستُعرض هنا -->
    </div>

    <div id="toolbar">
        <div id="weather-indicator">
            <span id="weather-status">الطقس: جارِ التحميل...</span>
        </div>
        <div id="controls">
            <button id="music-button" title="تشغيل/إيقاف الموسيقى">🎵</button>
            <button id="night-mode-button" title="الوضع الليلي">👁️</button>
            <button id="gps-button" title="تفعيل البوصلة">🧭</button>
            <button id="iss-button" title="إظهار محطة الفضاء">🛰️</button>
            <button id="info-button" title="معلومات فلكية">ℹ️</button>
        </div>
    </div>

    <!-- نافذة منبثقة للقسم التعليمي -->
    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>القسم التعليمي</h2>
            <div id="educational-container">
                <div id="topics-list">
                    <!-- سيتم ملء القائمة هنا عبر JavaScript -->
                </div>
                <div id="topic-content">
                    <p>اختر موضوعًا من القائمة للبدء.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- إضافة المكتبات المطلوبة -->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://d3-celestial.github.io/celestial.min.js"></script>
    
    <!-- ملف السكربت الخاص بنا -->
    <script src="script.js"></script>
    
    <!-- تسجيل Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
